server {
    listen 80;
    listen [::]:80;
    server_name call.prav-buro.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name call.prav-buro.ru;

    ssl_certificate /etc/letsencrypt/live/call.prav-buro.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/call.prav-buro.ru/privkey.pem;

    client_max_body_size 2m;

    # Replace both placeholders during deployment with the token from the
    # Call Tracker environment. Do not commit the production token.
    location = /bitrix/__CALL_TRACKER_WEBHOOK_TOKEN__ {
        access_log off;
        proxy_set_header X-Webhook-Token __CALL_TRACKER_WEBHOOK_TOKEN__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8044/api/v1/webhooks/calls;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /health {
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:8044/health;
    }

    location / {
        return 404;
    }
}
