<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Отчёт по обращениям</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: var(--tg-theme-bg-color, #f4f6f8);
      --card: var(--tg-theme-secondary-bg-color, #fff);
      --text: var(--tg-theme-text-color, #17212b);
      --hint: var(--tg-theme-hint-color, #7d8b99);
      --button: var(--tg-theme-button-color, #2481cc);
      --button-text: var(--tg-theme-button-text-color, #fff);
      --line: color-mix(in srgb, var(--hint) 22%, transparent);
      --accent-soft: color-mix(in srgb, var(--button) 12%, var(--card));
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased; overflow-x: hidden;
    }
    main { max-width: 680px; margin: 0 auto; padding: 22px 16px calc(32px + env(safe-area-inset-bottom)); }
    h1 { margin: 0 0 5px; font-size: 25px; letter-spacing: -.4px; }
    .subtitle { margin: 0 0 20px; color: var(--hint); }
    .panel, .source, .kpi { background: var(--card); border-radius: 16px; }
    .panel { padding: 16px; box-shadow: 0 2px 14px rgba(0,0,0,.04); }
    .quick { display: flex; gap: 7px; overflow-x: auto; margin: 0 -2px 15px; padding: 2px; scrollbar-width: none; }
    .quick::-webkit-scrollbar { display: none; }
    .chip, .tab, .manager-toggle, .all-managers {
      border: 0; color: var(--text); background: var(--accent-soft); font: inherit;
      white-space: nowrap; border-radius: 999px; padding: 8px 12px; cursor: pointer;
    }
    .chip:active, .tab:active, .source:active { transform: scale(.985); }
    .dates { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .period-preview { margin-top: 10px; color: var(--hint); text-align: center; font-size: 12px; }
    .date-field { display: block; min-width: 0; color: var(--hint); font-size: 12px; font-weight: 600; }
    .date-control {
      position: relative; display: flex; align-items: center; gap: 8px; width: 100%;
      min-height: 48px; margin-top: 6px; padding: 11px 13px; color: var(--text);
      background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
      font-size: 15px; font-weight: 650;
    }
    .date-value { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .date-icon { color: var(--button); font-size: 17px; line-height: 1; }
    .date-control input[type=date] {
      position: absolute; inset: 0; width: 100%; height: 100%; margin: 0;
      border: 0; opacity: 0; cursor: pointer; -webkit-appearance: none; appearance: none;
    }
    .build {
      display: block; min-width: 190px; margin: 18px auto 0; padding: 12px 20px;
      border: 0; border-radius: 12px; background: var(--button); color: var(--button-text);
      font: inherit; font-weight: 700; cursor: pointer;
    }
    .build:disabled { opacity: .6; cursor: default; }
    #status { min-height: 20px; margin-top: 12px; color: var(--hint); text-align: center; font-size: 13px; }
    #status.error { color: #d44; }
    .progress-wrap { margin-top: 12px; }
    .progress-track { height: 7px; overflow: hidden; border-radius: 999px; background: var(--line); }
    .progress-fill { width: 0; height: 100%; border-radius: inherit; background: var(--button); transition: width .35s ease; }
    .progress-label { margin-top: 7px; color: var(--hint); text-align: center; font-size: 12px; }
    #report { margin-top: 18px; }
    .hidden { display: none !important; }
    .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .kpi { padding: 15px; border: 1px solid var(--line); }
    .kpi strong { display: block; font-size: 29px; line-height: 1.05; color: var(--button); }
    .kpi span { display: block; margin-top: 5px; color: var(--hint); font-size: 13px; }
    .meta { margin: 10px 2px 16px; color: var(--hint); font-size: 12px; }
    .manager-filter { margin-bottom: 13px; padding: 13px; background: var(--card); border-radius: 14px; }
    .manager-title { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .manager-title strong { flex: 1; }
    .all-managers { padding: 6px 10px; font-size: 13px; }
    .all-managers.active, .manager-toggle.active { background: var(--button); color: var(--button-text); }
    .manager-options { display: flex; flex-wrap: wrap; gap: 7px; }
    .manager-toggle { padding: 7px 10px; font-size: 13px; }
    .manager-hint { margin-top: 9px; color: var(--hint); font-size: 11px; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; padding: 4px; background: var(--card); border-radius: 14px; }
    .tab { background: transparent; border-radius: 10px; padding: 10px; font-weight: 650; }
    .tab.active { background: var(--button); color: var(--button-text); }
    .list { margin-top: 11px; display: grid; gap: 8px; }
    .source { width: 100%; border: 1px solid var(--line); padding: 0; color: var(--text); text-align: left; overflow: hidden; }
    .source-head { display: flex; align-items: center; gap: 9px; padding: 14px; cursor: pointer; }
    .source-name { min-width: 0; flex: 1; font-weight: 650; overflow-wrap: anywhere; }
    .source-total { min-width: 31px; padding: 3px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--button); text-align: center; font-weight: 750; }
    .chevron { color: var(--hint); transition: transform .2s; }
    .source.open .chevron { transform: rotate(180deg); }
    .details { display: none; padding: 0 14px 12px; border-top: 1px solid var(--line); }
    .source.open .details { display: block; }
    .stage-block + .stage-block { border-top: 1px solid var(--line); }
    .stage { display: flex; gap: 10px; padding: 11px 0; color: var(--hint); cursor: pointer; }
    .stage span:first-child { min-width: 0; flex: 1; overflow-wrap: anywhere; }
    .stage b { color: var(--text); }
    .stage-arrow { color: var(--hint); transition: transform .2s; }
    .stage-block.open .stage-arrow { transform: rotate(180deg); }
    .entity-links { display: none; padding: 0 0 11px 9px; gap: 7px; }
    .stage-block.open .entity-links { display: grid; }
    .entity-row { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 10px; }
    .entity-link { color: var(--button); font-weight: 650; text-decoration: none; }
    .entity-manager { color: var(--hint); font-size: 11px; }
    .contract-note { margin-top: 10px; color: var(--button); font-weight: 650; }
    .empty { padding: 26px 12px; color: var(--hint); text-align: center; }
    .spinner { display: inline-block; width: 14px; height: 14px; margin-right: 7px; border: 2px solid var(--line); border-top-color: var(--button); border-radius: 50%; vertical-align: -2px; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 520px) {
      main { padding: 18px 14px calc(28px + env(safe-area-inset-bottom)); }
      h1 { font-size: 24px; }
      .subtitle { margin-bottom: 17px; }
      .panel { padding: 14px; }
      .quick { display: grid; grid-template-columns: 1fr 1fr; overflow: visible; margin: 0 0 16px; padding: 0; }
      .chip { width: 100%; padding: 10px 7px; overflow: hidden; text-overflow: ellipsis; }
      .dates { grid-template-columns: 1fr; gap: 12px; }
      .date-control { background: var(--card); }
      .period-preview { margin: 12px 4px 0; line-height: 1.45; }
      .build { width: min(100%, 280px); margin-top: 16px; }
      .manager-filter { padding: 12px; }
      .summary { gap: 8px; }
      .kpi { padding: 13px; }
      .kpi strong { font-size: 26px; }
      .source-head { padding: 13px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Отчёт по обращениям</h1>
    <p class="subtitle">Текущее состояние лидов и сделок из выбранного периода</p>

    <section class="panel">
      <div class="quick" aria-label="Быстрый выбор периода">
        <button class="chip" data-period="today">Сегодня</button>
        <button class="chip" data-period="7days">7 дней</button>
        <button class="chip" data-period="month">Этот месяц</button>
        <button class="chip" data-period="previous">Прошлый месяц</button>
      </div>
      <div class="dates">
        <label class="date-field">Дата начала
          <span class="date-control">
            <span id="start-display" class="date-value"></span><span class="date-icon">▾</span>
            <input id="start" type="date" required aria-label="Дата начала">
          </span>
        </label>
        <label class="date-field">Дата окончания
          <span class="date-control">
            <span id="end-display" class="date-value"></span><span class="date-icon">▾</span>
            <input id="end" type="date" required aria-label="Дата окончания">
          </span>
        </label>
      </div>
      <div id="period-preview" class="period-preview"></div>
      <button id="build" class="build">Показать отчёт</button>
      <div id="status" role="status"></div>
    </section>

    <section id="report" class="hidden" aria-live="polite">
      <div class="summary">
        <div class="kpi"><strong id="converted">0</strong><span>Сконвертировано в сделки</span></div>
        <div class="kpi"><strong id="contracts">0</strong><span>Договоров</span></div>
      </div>
      <div id="meta" class="meta"></div>
      <section id="manager-filter" class="manager-filter hidden">
        <div class="manager-title">
          <strong>Ответственные</strong>
          <button id="all-managers" class="all-managers active">Все</button>
        </div>
        <div id="manager-options" class="manager-options"></div>
        <div class="manager-hint">Без выбранных менеджеров показывается общая статистика</div>
      </section>
      <nav class="tabs" aria-label="Раздел отчёта">
        <button class="tab active" data-tab="leads">Лиды <span id="lead-count"></span></button>
        <button class="tab" data-tab="deals">Сделки <span id="deal-count"></span></button>
      </nav>
      <div id="source-list" class="list"></div>
    </section>
  </main>

  <script>
    (() => {
      const tg = window.Telegram && window.Telegram.WebApp;
      if (tg) { tg.ready(); tg.expand(); }
      const startInput = document.getElementById('start');
      const endInput = document.getElementById('end');
      const startDisplay = document.getElementById('start-display');
      const endDisplay = document.getElementById('end-display');
      const buildButton = document.getElementById('build');
      const periodPreview = document.getElementById('period-preview');
      const status = document.getElementById('status');
      const report = document.getElementById('report');
      const list = document.getElementById('source-list');
      const managerFilter = document.getElementById('manager-filter');
      const managerOptions = document.getElementById('manager-options');
      const allManagers = document.getElementById('all-managers');
      let data = null;
      let activeTab = 'leads';
      const selectedManagers = new Set();

      const iso = date => {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      };
      const localDate = value => new Date(`${value}T00:00:00`);
      const shortDate = value => localDate(value).toLocaleDateString('ru-RU');
      const longDate = value => localDate(value).toLocaleDateString('ru-RU', {day: 'numeric', month: 'long', year: 'numeric'});
      const updatePeriodPreview = () => {
        startDisplay.textContent = startInput.value ? longDate(startInput.value) : 'Выберите дату';
        endDisplay.textContent = endInput.value ? longDate(endInput.value) : 'Выберите дату';
        periodPreview.textContent = startInput.value && endInput.value
          ? `Выбрано: ${longDate(startInput.value)} — ${longDate(endInput.value)}` : '';
      };
      const setDates = (start, end) => {
        startInput.value = iso(start); endInput.value = iso(end); updatePeriodPreview();
      };
      const now = new Date();
      setDates(new Date(now.getFullYear(), now.getMonth(), 1), now);
      startInput.addEventListener('change', updatePeriodPreview);
      endInput.addEventListener('change', updatePeriodPreview);

      const confirmLargePeriod = message => new Promise(resolve => {
        if (tg && tg.showConfirm) tg.showConfirm(message, resolve);
        else resolve(window.confirm(message));
      });

      document.querySelectorAll('[data-period]').forEach(button => button.addEventListener('click', () => {
        const today = new Date();
        let start = new Date(today), end = new Date(today);
        if (button.dataset.period === '7days') start.setDate(start.getDate() - 6);
        if (button.dataset.period === 'month') start = new Date(today.getFullYear(), today.getMonth(), 1);
        if (button.dataset.period === 'previous') {
          start = new Date(today.getFullYear(), today.getMonth() - 1, 1);
          end = new Date(today.getFullYear(), today.getMonth(), 0);
        }
        setDates(start, end);
        if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
      }));

      function filteredRows(tab) {
        return data[tab].map(row => {
          const stages = row.stages.map(stage => {
            const items = stage.items.filter(item => !selectedManagers.size || selectedManagers.has(item.manager_id));
            return {...stage, items, count: items.length};
          }).filter(stage => stage.count);
          const items = stages.flatMap(stage => stage.items);
          return {...row, stages, total: items.length, contracts: items.filter(item => item.contract).length};
        }).filter(row => row.total);
      }

      function filteredItems(tab) {
        return filteredRows(tab).flatMap(row => row.stages.flatMap(stage => stage.items));
      }

      function renderManagers() {
        managerOptions.replaceChildren();
        allManagers.classList.toggle('active', selectedManagers.size === 0);
        allManagers.setAttribute('aria-pressed', String(selectedManagers.size === 0));
        data.managers.forEach(manager => {
          const button = document.createElement('button');
          button.className = 'manager-toggle';
          button.classList.toggle('active', selectedManagers.has(manager.id));
          button.setAttribute('aria-pressed', String(selectedManagers.has(manager.id)));
          button.textContent = manager.name;
          button.addEventListener('click', () => {
            if (selectedManagers.has(manager.id)) selectedManagers.delete(manager.id);
            else selectedManagers.add(manager.id);
            render();
            if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
          });
          managerOptions.append(button);
        });
        managerFilter.classList.toggle('hidden', data.managers.length === 0);
      }

      allManagers.addEventListener('click', () => {
        selectedManagers.clear(); render();
        if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
      });

      function renderSources() {
        list.replaceChildren();
        const rows = filteredRows(activeTab);
        if (!rows.length) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = activeTab === 'leads' ? 'Лидов за этот период нет' : 'Сделок за этот период нет';
          list.append(empty);
          return;
        }
        rows.forEach(row => {
          const card = document.createElement('section');
          card.className = 'source';
          const head = document.createElement('div');
          head.className = 'source-head';
          head.setAttribute('role', 'button'); head.tabIndex = 0;
          const name = document.createElement('span'); name.className = 'source-name'; name.textContent = row.source;
          const total = document.createElement('span'); total.className = 'source-total'; total.textContent = row.total;
          const arrow = document.createElement('span'); arrow.className = 'chevron'; arrow.textContent = '⌄';
          head.append(name, total, arrow);
          const details = document.createElement('div'); details.className = 'details';
          row.stages.forEach(stage => {
            const stageBlock = document.createElement('div'); stageBlock.className = 'stage-block';
            const line = document.createElement('div'); line.className = 'stage';
            line.setAttribute('role', 'button'); line.tabIndex = 0;
            const label = document.createElement('span'); label.textContent = stage.name;
            const count = document.createElement('b'); count.textContent = stage.count;
            const stageArrow = document.createElement('span'); stageArrow.className = 'stage-arrow'; stageArrow.textContent = '⌄';
            line.append(label, count, stageArrow);
            const links = document.createElement('div'); links.className = 'entity-links';
            let linksRendered = false;
            const renderLinks = () => {
              if (linksRendered) return;
              stage.items.forEach(item => {
                const entityRow = document.createElement('div'); entityRow.className = 'entity-row';
                const primary = document.createElement('a'); primary.className = 'entity-link';
                primary.href = item.url; primary.target = '_blank'; primary.rel = 'noopener noreferrer';
                primary.textContent = `${activeTab === 'leads' ? 'Лид' : 'Сделка'} №${item.id}`;
                entityRow.append(primary);
                if (activeTab === 'leads' && item.deal_id) {
                  const deal = document.createElement('a'); deal.className = 'entity-link';
                  deal.href = item.deal_url; deal.target = '_blank'; deal.rel = 'noopener noreferrer';
                  deal.textContent = `Сделка №${item.deal_id}`; entityRow.append(deal);
                }
                const manager = document.createElement('span'); manager.className = 'entity-manager';
                manager.textContent = item.manager_name; entityRow.append(manager);
                links.append(entityRow);
              });
              linksRendered = true;
            };
            const toggleStage = () => { renderLinks(); stageBlock.classList.toggle('open'); };
            line.addEventListener('click', toggleStage);
            line.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); toggleStage(); } });
            stageBlock.append(line, links); details.append(stageBlock);
          });
          if (activeTab === 'deals' && row.contracts) {
            const note = document.createElement('div'); note.className = 'contract-note';
            note.textContent = `Договоров: ${row.contracts}`; details.append(note);
          }
          const toggle = () => card.classList.toggle('open');
          head.addEventListener('click', toggle);
          head.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); toggle(); } });
          card.append(head, details); list.append(card);
        });
      }

      function render() {
        const leads = filteredItems('leads');
        const deals = filteredItems('deals');
        document.getElementById('converted').textContent = leads.filter(item => item.converted).length;
        document.getElementById('contracts').textContent = deals.filter(item => item.contract).length;
        document.getElementById('lead-count').textContent = `· ${leads.length}`;
        document.getElementById('deal-count').textContent = `· ${deals.length}`;
        const unique = leads.length + deals.filter(item => item.direct).length;
        document.getElementById('meta').textContent =
          `${shortDate(data.period.start)}–${shortDate(data.period.end)} · обращений: ${unique}`;
        report.classList.remove('hidden'); renderManagers(); renderSources();
      }

      function showProgress(percent, message) {
        status.className = '';
        status.replaceChildren();
        const wrap = document.createElement('div'); wrap.className = 'progress-wrap';
        const track = document.createElement('div'); track.className = 'progress-track';
        const fill = document.createElement('div'); fill.className = 'progress-fill';
        fill.style.width = `${Math.max(1, Math.min(100, percent))}%`;
        const label = document.createElement('div'); label.className = 'progress-label';
        label.textContent = `${message} · ${percent}%`;
        track.append(fill); wrap.append(track, label); status.append(wrap);
      }

      const requestHeaders = () => ({'X-Telegram-Init-Data': tg ? tg.initData : ''});
      const wait = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));

      async function buildReport(params) {
        const started = await fetch(`/api/miniapp/report/jobs?${params}`, {
          method: 'POST', headers: requestHeaders()
        });
        if (!started.ok) {
          const body = await started.json().catch(() => ({}));
          throw new Error(body.detail || 'Не удалось запустить отчёт');
        }
        const {job_id: jobId} = await started.json();
        while (true) {
          const response = await fetch(`/api/miniapp/report/jobs/${encodeURIComponent(jobId)}`, {
            headers: requestHeaders()
          });
          if (!response.ok) {
            const body = await response.json().catch(() => ({}));
            throw new Error(body.detail || 'Не удалось получить состояние отчёта');
          }
          const job = await response.json();
          showProgress(job.progress, job.message);
          if (job.status === 'done') return job.result;
          if (job.status === 'error') throw new Error(job.message || 'Не удалось построить отчёт');
          await wait(1500);
        }
      }

      document.querySelectorAll('[data-tab]').forEach(button => button.addEventListener('click', () => {
        activeTab = button.dataset.tab;
        document.querySelectorAll('[data-tab]').forEach(tab => tab.classList.toggle('active', tab === button));
        renderSources();
        if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
      }));

      buildButton.addEventListener('click', async () => {
        status.className = '';
        if (!startInput.value || !endInput.value || startInput.value > endInput.value) {
          status.className = 'error'; status.textContent = 'Проверьте выбранные даты'; return;
        }
        const periodDays = Math.round((localDate(endInput.value) - localDate(startInput.value)) / 86400000) + 1;
        if (periodDays > 92) {
          const confirmed = await confirmLargePeriod(
            `Выбран большой период: ${longDate(startInput.value)} — ${longDate(endInput.value)} (${periodDays} дней). Отчёт может строиться несколько минут. Продолжить?`
          );
          if (!confirmed) return;
        }
        buildButton.disabled = true;
        showProgress(1, 'Готовлю запрос');
        try {
          const params = new URLSearchParams({start: startInput.value, end: endInput.value});
          data = await buildReport(params); activeTab = 'leads'; selectedManagers.clear();
          document.querySelectorAll('[data-tab]').forEach(tab => tab.classList.toggle('active', tab.dataset.tab === activeTab));
          render(); status.textContent = 'Данные сверены с CRM · 100%';
          if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        } catch (error) {
          status.className = 'error'; status.textContent = error.message;
          if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
        } finally { buildButton.disabled = false; }
      });
    })();
  </script>
</body>
</html>
